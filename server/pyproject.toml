[project]
name = "lecturewhisper"
version = "0.1.0"
description = "Fully local lecture notes system for Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "click>=8.1.0,<9.0",
    "rich>=13.9.0,<14.0",
    "zeroconf>=0.136.0,<1.0",
    "qrcode[pil]>=8.0,<9.0",
    "tomli>=2.0.0,<3.0; python_version < '3.11'",
    "sse-starlette>=2.1.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "python-multipart>=0.0.12",
    "pypdf>=6.19.0",
]

[project.optional-dependencies]
pipeline = [
    "mlx-whisper>=0.4.3,<0.5",
    "pyannote.audio>=4.0.7,<5.0",
    "silero-vad>=6.2.0,<7.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "sentence-transformers>=4.0.0",
    "jiwer>=3.0.0,<4.0",
]
llm = [
    "mlx-lm>=0.31.0,<1.0",
    "outlines[mlxlm]>=0.1.0",
    "dateparser>=1.2.0,<2.0",
]
vlm = [
    "mlx-vlm>=0.7.0,<1.0",
]
upload = [
    "tuspyserver>=4.2.0,<5.0",
]
train = [
    "rouge-score>=0.1.2,<1.0",
]
all = [
    "lecturewhisper[pipeline,llm,vlm,upload,train]",
]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.11.0,<2.0",
    "httpx>=0.27.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.11.0,<2.0",
    "httpx>=0.27.0,<1.0",
]

[project.scripts]
lecturewhisper = "lecturewhisper.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecturewhisper"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that load real ML models (deselect with '-m \"not slow\"')",
]
